name: Update Keyescape Schedule

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_schedule.py'
      - 'scripts/theme_config.py'
      - '.github/workflows/update_schedule.yml'

concurrency:
  group: update-keyescape-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run schedule regression tests
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py'
          node --test tests/schedule.test.cjs

      - name: Run schedule fetcher
        run: python scripts/update_schedule.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/schedule.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update schedule data [skip ci]"
          git pull --rebase origin master
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
